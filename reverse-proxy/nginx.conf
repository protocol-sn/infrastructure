events {}

http {	
	include       /etc/nginx/mime.types;
	default_type  text/html;
	
	server {
		listen 5005;
		listen [::]:5005;
		server_name _;
		
		location /auth/realms {
			proxy_pass 				http://keycloak:8080/auth/realms;
			proxy_set_header X-Real-IP 		$remote_addr;
        		proxy_set_header X-Forwarded-For 	$proxy_add_x_forwarded_for;
        		proxy_set_header X-Forwarded-Proto 	$scheme;
        		proxy_set_header X-Forwarded-Host 	keycloak.psn.local;
			proxy_set_header X-Forwarded-Port 	5005;
                    	add_header Set-Cookie 			$http_cookie;
		}
		
		location /auth/resources {
			proxy_pass 				http://keycloak:8080/auth/resources;
			proxy_set_header X-Real-IP 		$remote_addr;
        		proxy_set_header X-Forwarded-For 	$proxy_add_x_forwarded_for;
        		proxy_set_header X-Forwarded-Proto 	$scheme;
        		proxy_set_header X-Forwarded-Host 	keycloak.psn.local;
			proxy_set_header X-Forwarded-Port 	5005;
                    	add_header Set-Cookie 			$http_cookie;
		}

		location /user {
			proxy_pass http://psn-user-plugin:8080/user;
		}

		location /blog {
			proxy_pass http://psn-blog-plugin:8080/blog;
		}
	}
}
